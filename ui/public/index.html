<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strongbox</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d1117'/%3E%3Cpath d='M7 10V8a5 5 0 0 1 10 0v2' stroke='%2358a6ff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Crect x='5' y='10' width='14' height='10' rx='2' fill='%2358a6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="toolbar">
    <span class="wordmark">Strongbox</span>
    <input id="search" class="input toolbar-search" type="text" placeholder="Search by name or prefix...">

    <div class="toolbar-spacer"></div>

    <div class="toolbar-actions">
      <button id="add-open" class="btn btn-ghost icon-btn" title="Add secret" aria-label="Add secret">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <details class="disclosure popover-menu">
        <summary class="btn btn-ghost icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </summary>
        <div class="form-body popover-panel">
          <div class="settings-actions">
            <button id="load" class="btn btn-primary btn-sm">Reload</button>
            <span id="load-status"></span>
          </div>
          <input id="token" class="input" type="password" placeholder="Bearer token">
          <label class="settings-label" for="token">Bearer token (auto-remembered after first use)</label>
        </div>
      </details>
    </div>
  </div>

  <section class="card">
    <div class="table-wrap">
      <table class="table">
        <colgroup>
          <col class="col-name"><col class="col-usedby"><col class="col-purpose"><col class="col-rotated"><col class="col-action">
        </colgroup>
        <thead>
          <tr><th>Name</th><th>Used by</th><th>Purpose</th><th>Last rotated</th><th>Action</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty-state" hidden></div>
  </section>
</div>

<dialog id="secret-modal" class="modal" aria-labelledby="modal-title">
  <div class="modal-body">
    <h2 id="modal-title" class="modal-title">Add secret</h2>
    <label class="settings-label" for="modal-name">Name</label>
    <input id="modal-name" class="input input-mono" type="text" placeholder="relay.MySecretName" autofocus>
    <label class="settings-label" for="modal-value">Value</label>
    <input id="modal-value" class="input input-mono" type="password" placeholder="value">
    <label class="settings-label" for="modal-purpose">Purpose</label>
    <input id="modal-purpose" class="input" type="text" placeholder="purpose">
    <label class="settings-label" for="modal-usedby">Used by</label>
    <input id="modal-usedby" class="input" type="text" placeholder="used by">
    <label class="settings-label" for="modal-rotation">Rotation days</label>
    <input id="modal-rotation" class="input" type="number" placeholder="rotation days">
    <div class="modal-actions">
      <div class="modal-actions-left">
        <button type="button" id="modal-submit" class="btn btn-primary">Save</button>
        <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
      </div>
      <div class="modal-actions-right">
        <span id="modal-status"></span>
        <button type="button" id="modal-delete" class="btn btn-danger" hidden>Delete</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="reveal-modal" class="modal" aria-labelledby="reveal-title">
  <div class="modal-body">
    <h2 id="reveal-title" class="modal-title">Reveal secret</h2>
    <div class="reveal-value-row">
      <span id="reveal-value" class="value-text"></span>
      <button type="button" id="reveal-copy" class="btn btn-ghost btn-sm icon-btn" title="Copy to clipboard" aria-label="Copy to clipboard" autofocus>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
    </div>
    <div class="modal-actions">
      <div class="modal-actions-left"></div>
      <div class="modal-actions-right">
        <button type="button" id="reveal-close" class="btn btn-ghost">Close</button>
      </div>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
